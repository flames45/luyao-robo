services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      LINGSHU_PUBLIC_MODE: "1"
      LINGSHU_HOST: 0.0.0.0
      LINGSHU_PORT: "8002"
      LINGSHU_DATA_DIR: /app/web_data
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - app_data:/app/web_data
    expose:
      - "8002"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?请在.env中设置SITE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  app_data:
  caddy_data:
  caddy_config:
